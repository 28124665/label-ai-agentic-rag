# The RAGFlow team do not actively maintain docker-compose-CN-oc9.yml, so use them at your own risk. 
# However, you are welcome to file a pull request to improve it.
include:
  - ./docker-compose-base.yml

services:
  data-knowledge-api-cpu:
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - cpu
    image: edwardelric233/data-knowledge-api:oc9
    ports:
      - ${SVR_HTTP_PORT}:9380
      - 80:80
      - 443:443
    volumes:
      - ./data-knowledge-api-logs:/data-knowledge-api/logs
      - ./nginx/data-knowledge-api.conf:/etc/nginx/conf.d/data-knowledge-api.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file: .env
    networks:
      - data-knowledge-api
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you're using Docker Desktop, the --add-host flag is optional. This flag makes sure that the host's internal IP gets exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data-knowledge-api-gpu:
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - gpu
    image: edwardelric233/data-knowledge-api:oc9
    ports:
      - ${SVR_HTTP_PORT}:9380
      - 80:80
      - 443:443
    volumes:
      - ./data-knowledge-api-logs:/data-knowledge-api/logs
      - ./nginx/data-knowledge-api.conf:/etc/nginx/conf.d/data-knowledge-api.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file: .env
    networks:
      - data-knowledge-api
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you're using Docker Desktop, the --add-host flag is optional. This flag makes sure that the host's internal IP gets exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
