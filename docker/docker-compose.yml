# 仅依赖服务（PostgreSQL、Redis 等定义在 docker-compose-base.yml）。
# 应用在宿主机启动（与官方本地开发方式一致）：
#   cd 仓库根目录
#   export PYTHONPATH=$(pwd) && source docker/.env && python3 api/data-knowledge-api_server.py
#   export PYTHONPATH=$(pwd) && source docker/.env && python3 rag/svr/task_executor.py 0
#   cd web && npm run dev
#
# 启动依赖（PostgreSQL 需显式 profile；Redis 无 profile，会一起起来）：
#   cd docker && docker compose --profile postgres up -d
#
# 若要把应用也放进容器（需已本地 docker build / docker load 好镜像），见 docker-compose.app.yml

include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  data-knowledge-api-cpu:
#    depends_on:
#      postgresql:
#        condition: service_healthy
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE:-data-knowledge-api:v1.0.0}
    # Build locally (this name is not on Docker Hub; do not pull).
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DEPS_IMAGE: ${RAGFLOW_DEPS_IMAGE:-infiniflow/ragflow_deps:latest}
        BASE_IMAGE: ${DOCKER_BASE_IMAGE:-ubuntu:24.04}
        NEED_MIRROR: ${NEED_MIRROR:-0}
    pull_policy: never
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/data-knowledge-api/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=data-knowledge-api-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
    ports:
      - ${SVR_WEB_HTTP_PORT:-80}:80
      - ${SVR_WEB_HTTPS_PORT:-443}:443
      - ${SVR_HTTP_PORT:-9380}:9380
      - ${ADMIN_SVR_HTTP_PORT:-9381}:9381
      - ${SVR_MCP_PORT:-9382}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
    volumes:
      - ./data-knowledge-api-logs:/data-knowledge-api/logs
      - ./nginx/data-knowledge-api.conf:/etc/nginx/conf.d/data-knowledge-api.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/data-knowledge-api/conf/service_conf.yaml.template
      - ./entrypoint.sh:/data-knowledge-api/entrypoint.sh
    env_file: .env
    networks:
      - data-knowledge-api
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data-knowledge-api-gpu:
#    depends_on:
#      postgresql:
#        condition: service_healthy
    profiles:
      - gpu
    image: ${RAGFLOW_IMAGE:-data-knowledge-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        DEPS_IMAGE: ${RAGFLOW_DEPS_IMAGE:-infiniflow/ragflow_deps:latest}
        BASE_IMAGE: ${DOCKER_BASE_IMAGE:-ubuntu:24.04}
        NEED_MIRROR: ${NEED_MIRROR:-0}
    pull_policy: never
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/data-knowledge-api/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=data-knowledge-api-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
    ports:
      - ${SVR_WEB_HTTP_PORT:-80}:80
      - ${SVR_WEB_HTTPS_PORT:-443}:443
      - ${SVR_HTTP_PORT:-9380}:9380
      - ${ADMIN_SVR_HTTP_PORT:-9381}:9381
      - ${SVR_MCP_PORT:-9382}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
    volumes:
      - ./data-knowledge-api-logs:/data-knowledge-api/logs
      - ./nginx/data-knowledge-api.conf:/etc/nginx/conf.d/data-knowledge-api.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/data-knowledge-api/conf/service_conf.yaml.template
      - ./entrypoint.sh:/data-knowledge-api/entrypoint.sh
    env_file: .env
    networks:
      - data-knowledge-api
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


