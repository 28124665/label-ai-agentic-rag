# Based on docker compose .env file

# Global image pull secrets configuration
global:
  # Global image repo prefix to render all images from a mirror/registry.
  # Example: "registry.example.com/myproj"
  # When set, template will replace the registry part of each image and keep the path.
  # Leave empty to use per-image repositories as-is.
  repo: ""
  # Global image pull secrets for all pods（需在目标 namespace 预先创建 docker-registry 类型 Secret）
  imagePullSecrets:
    - name: aliyun-registry-cred

# Pod 环境变量（写入 env Secret，entrypoint 据此生成 conf/service_conf.yaml）；与 docker/.env.dev.honghai 保持同步
env:
  DOC_ENGINE: postgresql
  DB_TYPE: postgres
  STACK_VERSION: "8.11.3"
  ELASTIC_PASSWORD: infini_rag_flow_helm
  OPENSEARCH_PASSWORD: infini_rag_flow_OS_01

  MYSQL_PASSWORD: ""
  MYSQL_DBNAME: rag_flow
  MYSQL_HOST: "unused.invalid"

  MINIO_ROOT_USER: rag_flow
  MINIO_PASSWORD: infini_rag_flow_helm

  # redis.enabled=false 时须填集群内可解析的主机或 IP（勿用字面 redis，除非确有同名 Service）
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # 无 requirepass 的 Redis/Valkey 须留空；有密码时在此填写或由 Secret 注入
  REDIS_PASSWORD: ""
  REDIS_DB: "12"

  TZ: "Asia/Shanghai"

  # Promtail：CONFIG_ENV=prod 使用 promtail-config-prod.yaml，否则 boe；集群侧已有采集时可设 ENABLE_PROMTAIL=false
  CONFIG_ENV: "boe"
  ENABLE_PROMTAIL: "true"

  POSTGRES_HOST: pgm-0jl31wqbx40n3mgx.pg.rds.aliyuncs.com
  POSTGRES_PORT: "5432"
  POSTGRES_DBNAME: rag_flow
  POSTGRES_USER: honghai_ai_rw
  POSTGRES_PASSWORD: ***REDACTED***
  POSTGRESQL_HOST: pgm-0jl31wqbx40n3mgx.pg.rds.aliyuncs.com
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_DBNAME: boss_ai_data
  POSTGRESQL_USER: boss_ai_data_rw
  POSTGRESQL_PASSWORD: ""

  OSS_ACCESS_KEY: ""
  OSS_SECRET_KEY: ""
  OSS_ENDPOINT_URL: "http://10.11.7.53:31773"
  OSS_REGION: us-east-1
  OSS_BUCKET: boss-ai
  OSS_SIGNATURE_VERSION: s3v4
  OSS_ADDRESSING_STYLE: path
  OSS_PREFIX_PATH: boss_ai/knowledge_data/ms365

  MEM_LIMIT: 4g
  STORAGE_IMPL: OSS
  REGISTER_ENABLED: "1"
  DISABLE_PASSWORD_LOGIN: "false"
  RAGFLOW_CRYPTO_ENABLED: "false"
  RAGFLOW_CRYPTO_ALGORITHM: aes-256-cbc
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  MAX_CONTENT_LENGTH: "134217728"
  DOC_BULK_SIZE: "4"
  EMBEDDING_BATCH_SIZE: "16"
  COMPOSE_PROFILES: cpu
  RAGFLOW_IMAGE: ai-data/data-knowledge-api:v1.0.0
  NEED_MIRROR: "1"
  DOCKER_BASE_IMAGE: ubuntu:24.04
  SVR_WEB_HTTP_PORT: "80"
  SVR_WEB_HTTPS_PORT: "443"
  SVR_HTTP_PORT: "9380"
  ADMIN_SVR_HTTP_PORT: "9381"
  SVR_MCP_PORT: "9382"

data-knowledge-api: &ragflowCompat
  image:
    repository: 01ai-registry.cn-shanghai.cr.aliyuncs.com/01-ai/infiniflow/data-knowledge-api
    tag: dev
    pullPolicy: Always
    pullSecrets: []
  # Optional service configuration overrides
  # to be written to local.service_conf.yaml
  # inside the data-knowledge-api container
  # https://data-knowledge-api.io/docs/dev/configurations#service-configuration
  service_conf:

  # Optional yaml formatted override for the
  # llm_factories.json file inside the data-knowledge-api
  # container.
  llm_factories:
    # factory_llm_infos:
    # - name: OpenAI-API-Compatible
    #   logo: ""
    #   tags: "LLM,TEXT EMBEDDING,SPEECH2TEXT,MODERATION"
    #   status: "1"
    #   llm:
    #     - llm_name: my-custom-llm
    #       tags: "LLM,CHAT,"
    #       max_tokens: 100000
    #       model_type: chat
    #       is_tools: false

  # Kubernetes configuration
  deployment:
    strategy:
    resources:
  service:
    type: NodePort
  admin:
    # Enable Admin Service
    enabled: true
    # Admin Service port configuration
    port: 9381
    serviceType: NodePort
  api:
    service:
      enabled: true
      type: NodePort

infinity:
  # false：不部署 infinity StatefulSet，DOC_ENGINE=infinity 时需设置 env.INFINITY_HOST
  enabled: false
  image:
    repository: infiniflow/infinity
    tag: v0.7.0-dev2
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
  deployment:
    strategy:
    resources:
  service:
    type: ClusterIP

elasticsearch:
  image:
    repository: elasticsearch
    tag: "8.11.3"
    pullPolicy: IfNotPresent
    pullSecrets: []
  initContainers:
    alpine:
      repository: alpine
      tag: latest
      pullPolicy: IfNotPresent
    busybox:
      repository: busybox
      tag: latest
      pullPolicy: IfNotPresent
  storage:
    className:
    capacity: 20Gi
  deployment:
    strategy:
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
  service:
    type: ClusterIP

opensearch:
  image:
    repository: opensearchproject/opensearch
    tag: 2.19.1
    pullPolicy: IfNotPresent
    pullSecrets: []
  initContainers:
    alpine:
      repository: alpine
      tag: latest
      pullPolicy: IfNotPresent
    busybox:
      repository: busybox
      tag: latest
      pullPolicy: IfNotPresent
  storage:
    className:
    capacity: 20Gi
  deployment:
    strategy:
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
  service:
    type: ClusterIP

minio:
  enabled: false
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2023-12-20T01-00-02Z
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
  deployment:
    strategy:
    resources:
  service:
    type: ClusterIP

mysql:
  enabled: false
  image:
    repository: mysql
    tag: 8.0.39
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
  deployment:
    strategy:
    resources:
  service:
    type: ClusterIP

redis:
  enabled: false
  image:
    repository: valkey/valkey
    tag: 8
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
  persistence:
    enabled: true
    # Set's the retention policy for the persistent storage (only available in k8s 1.32 or later)
    # https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    # retentionPolicy:
      # whenDeleted: Delete
      # whenScaled: Delete
  deployment:
    strategy:
    resources:
  service:
    type: ClusterIP


# This block is for setting up web service ingress. For more information, see:
# https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Templates still reference .Values.ragflow; alias to data-knowledge-api block above
ragflow: *ragflowCompat
