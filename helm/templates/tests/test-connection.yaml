apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "data-knowledge-api.fullname" . }}-test-connection"
  labels:
    {{- include "data-knowledge-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: {{ include "data-knowledge-api.imageRepo" (dict "root" . "repo" "busybox") }}
      command:
      - 'wget'
      args:
      - {{ printf "%s.%s.svc" (include "data-knowledge-api.fullname" .) .Release.Namespace }}
  restartPolicy: Never
