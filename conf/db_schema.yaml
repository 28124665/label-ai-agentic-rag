# 数据库 Schema 配置文件
# 定义可访问的数据库、表白名单及字段说明

databases:
  # MES 制造执行系统数据库
  mes-prod:
    type: "mysql"
    host: "${MES_DB_HOST:-localhost}"
    port: 3306
    database: "mes_system"
    user: "${MES_DB_USER:-readonly_user}"
    password: "${MES_DB_PASSWORD:-readonly_pass}"
    description: "查询生产制造数据：产量、工单、设备OEE"
    
    allowed_tables:
      - name: "production_order"
        description: "生产工单表"
        columns:
          - name: "order_id"
            type: "VARCHAR(50)"
            description: "工单编号"
          - name: "product_name"
            type: "VARCHAR(200)"
            description: "产品名称"
          - name: "planned_quantity"
            type: "INTEGER"
            description: "计划产量"
          - name: "actual_quantity"
            type: "INTEGER"
            description: "实际产量"
          - name: "factory_code"
            type: "VARCHAR(20)"
            description: "厂区代码（如：SZ-深圳, KS-昆山）"
          - name: "order_date"
            type: "DATE"
            description: "工单日期"
          - name: "status"
            type: "VARCHAR(20)"
            description: "工单状态（pending/in_progress/completed/cancelled）"

      - name: "output_record"
        description: "产量记录表"
        columns:
          - name: "record_id"
            type: "BIGINT"
            description: "记录ID"
          - name: "factory_code"
            type: "VARCHAR(20)"
            description: "厂区代码"
          - name: "product_name"
            type: "VARCHAR(200)"
            description: "产品名称"
          - name: "quantity"
            type: "INTEGER"
            description: "产量"
          - name: "record_date"
            type: "DATE"
            description: "记录日期"
          - name: "shift"
            type: "VARCHAR(10)"
            description: "班次（day/night）"

      - name: "equipment_status"
        description: "设备状态表"
        columns:
          - name: "equipment_id"
            type: "VARCHAR(50)"
            description: "设备编号"
          - name: "equipment_name"
            type: "VARCHAR(200)"
            description: "设备名称"
          - name: "status"
            type: "VARCHAR(20)"
            description: "设备状态（running/idle/maintenance/breakdown）"
          - name: "oee_value"
            type: "DECIMAL(5,2)"
            description: "OEE值（0-100）"
          - name: "record_time"
            type: "TIMESTAMP"
            description: "记录时间"

  # ERP 生产数据库
  erp-prod:
    type: "mysql"
    host: "${ERP_DB_HOST:-localhost}"
    port: 3306
    database: "erp_system"
    user: "${ERP_DB_USER:-readonly_user}"
    password: "${ERP_DB_PASSWORD:-readonly_pass}"
    description: "查询财务供应链数据：采购、成本、库存金额"
    
    allowed_tables:
      - name: "inventory_current"
        description: "当前库存表"
        columns:
          - name: "sku_id"
            type: "VARCHAR(50)"
            description: "SKU编号"
          - name: "product_name"
            type: "VARCHAR(200)"
            description: "产品名称"
          - name: "stock_quantity"
            type: "INTEGER"
            description: "库存数量"
          - name: "warehouse_name"
            type: "VARCHAR(100)"
            description: "仓库名称"
          - name: "last_update_time"
            type: "TIMESTAMP"
            description: "最后更新时间"

      - name: "purchase_order"
        description: "采购订单表"
        columns:
          - name: "po_id"
            type: "VARCHAR(50)"
            description: "采购订单号"
          - name: "supplier_name"
            type: "VARCHAR(200)"
            description: "供应商名称"
          - name: "material_name"
            type: "VARCHAR(200)"
            description: "物料名称"
          - name: "quantity"
            type: "INTEGER"
            description: "采购数量"
          - name: "unit_price"
            type: "DECIMAL(10,2)"
            description: "单价"
          - name: "order_date"
            type: "DATE"
            description: "订单日期"
          - name: "delivery_date"
            type: "DATE"
            description: "交货日期"
          - name: "status"
            type: "VARCHAR(20)"
            description: "订单状态（pending/delivered/cancelled）"

      - name: "supplier_score"
        description: "供应商评分表"
        columns:
          - name: "supplier_id"
            type: "VARCHAR(50)"
            description: "供应商ID"
          - name: "supplier_name"
            type: "VARCHAR(200)"
            description: "供应商名称"
          - name: "quality_score"
            type: "DECIMAL(5,2)"
            description: "质量评分（0-100）"
          - name: "delivery_score"
            type: "DECIMAL(5,2)"
            description: "交货准时率评分（0-100）"
          - name: "evaluation_date"
            type: "DATE"
            description: "评估日期"
