# Promtail - data-knowledge-api 正式环境（与 boe 相同采集规则，标签 namespace/environment 不同）

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki.log.svc.cluster.local:3100/loki/api/v1/push

scrape_configs:
  - job_name: data-knowledge-api-logs
    static_configs:
      - targets:
          - localhost
        labels:
          service: data-knowledge-api
          job: data-knowledge-api-logs
          app: ragflow
          namespace: boss-ai
          environment: prod
          version: "1.0.0"
          image: data-knowledge-api
          product: data-knowledge-api
          log_format: ragflow_python
          __path__: /data-knowledge-api/logs/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
          max_wait_time: 12s
      - replace:
          expression: "[\r\n]+"
          replace: " "
      - drop:
          expression: '^\s*$'
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}),\d+\s+(?P<level>\S+)\s+(?P<pid>\d+)\s+(?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
          location: Asia/Shanghai

  - job_name: data-knowledge-api-nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          service: data-knowledge-api
          job: data-knowledge-api-nginx-access
          app: ragflow
          namespace: boss-ai
          environment: prod
          product: data-knowledge-api
          log_format: nginx_access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - drop:
          expression: '^\s*$'

  - job_name: data-knowledge-api-nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          service: data-knowledge-api
          job: data-knowledge-api-nginx-error
          app: ragflow
          namespace: boss-ai
          environment: prod
          product: data-knowledge-api
          log_format: nginx_error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - drop:
          expression: '^\s*$'
