groups:
  - name: ragflow_observability
    interval: 30s
    rules:
      # -------------------------------------------------------------------
      # Quality alerts
      # -------------------------------------------------------------------
      - alert: RAGFlowLowRetrievalHitRate
        expr: avg by (kb_id) (rag_retrieval_hit_rate) < 0.6
        for: 5m
        labels:
          severity: warning
          team: rag
        annotations:
          summary: "RAG retrieval hit rate is low for kb {{ $labels.kb_id }}"
          description: "Retrieval hit rate for kb {{ $labels.kb_id }} has been below 0.6 for more than 5 minutes."

      - alert: RAGFlowLowFaithfulnessScore
        expr: avg by (kb_id) (rag_faithfulness_score) < 0.6
        for: 5m
        labels:
          severity: critical
          team: rag
        annotations:
          summary: "Hallucination detector faithfulness score is low for kb {{ $labels.kb_id }}"
          description: "Average faithfulness score for kb {{ $labels.kb_id }} has been below 0.6 for more than 5 minutes."

      # -------------------------------------------------------------------
      # Performance alerts
      # -------------------------------------------------------------------
      - alert: RAGFlowHighE2ELatency
        expr: histogram_quantile(0.95, sum by (le, kb_id) (rate(rag_e2e_latency_seconds_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: warning
          team: rag
        annotations:
          summary: "RAG end-to-end latency P95 is high for kb {{ $labels.kb_id }}"
          description: "E2E latency P95 for kb {{ $labels.kb_id }} has been above 30s for more than 5 minutes."

      - alert: RAGFlowHighRetrievalLatency
        expr: histogram_quantile(0.95, sum by (le, kb_id) (rate(rag_retrieval_latency_seconds_bucket[5m]))) > 10
        for: 5m
        labels:
          severity: warning
          team: rag
        annotations:
          summary: "Retrieval latency P95 is high for kb {{ $labels.kb_id }}"
          description: "Retrieval latency P95 for kb {{ $labels.kb_id }} has been above 10s for more than 5 minutes."

      - alert: RAGFlowHighGenerateLatency
        expr: histogram_quantile(0.95, sum by (le, model) (rate(rag_generate_latency_seconds_bucket[5m]))) > 60
        for: 5m
        labels:
          severity: warning
          team: rag
        annotations:
          summary: "LLM generation latency P95 is high for model {{ $labels.model }}"
          description: "Generate latency P95 for model {{ $labels.model }} has been above 60s for more than 5 minutes."

      # -------------------------------------------------------------------
      # Reliability alerts
      # -------------------------------------------------------------------
      - alert: RAGFlowHigh5xxRate
        expr: rag_http_5xx_rate > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "RAG HTTP 5xx rate is high"
          description: "HTTP 5xx rate has been above 5% for more than 2 minutes."

      - alert: RAGFlowHighTimeoutRate
        expr: rag_timeout_rate > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "RAG request timeout rate is high"
          description: "Timeout rate has been above 5% for more than 2 minutes."

      - alert: RAGFlowDegradationSpike
        expr: sum by (reason) (increase(rag_degradation_count[5m])) > 10
        for: 2m
        labels:
          severity: warning
          team: rag
        annotations:
          summary: "RAG degradation spike for reason {{ $labels.reason }}"
          description: "Degradation count for reason {{ $labels.reason }} increased by more than 10 in the last 5 minutes."

      # -------------------------------------------------------------------
      # Cost alerts
      # -------------------------------------------------------------------
      - alert: RAGFlowHighLLMCost
        expr: sum by (model) (increase(rag_llm_cost_total[1h])) > 5
        for: 0m
        labels:
          severity: warning
          team: rag
        annotations:
          summary: "High LLM cost for model {{ $labels.model }}"
          description: "LLM cost for model {{ $labels.model }} exceeded $5 in the last hour."

  # -------------------------------------------------------------------
  # P2-2: SLO 燃烧率告警
  # -------------------------------------------------------------------
  - name: ragflow_slo
    interval: 30s
    rules:
      # SLO 1: 答案可用性 — reject + exhausted 比例 < 1%(30天错误预算 7.2h)
      - alert: RAGSLOAnswerAvailabilityBurn
        expr: |
          sum(rate(rag_hallucination_action_total{action=~"reject|exhausted"}[1h]))
          / sum(rate(rag_hallucination_action_total[1h])) > 0.05
        for: 5m
        labels:
          severity: critical
          slo: answer_availability
        annotations:
          summary: "答案可用性 SLO 燃烧率超限,reject+exhausted 率 > 5%"
          description: "1h 内拒答率 {{ $value | humanizePercentage }},超过 5% 阈值,错误预算快速消耗"

      # SLO 2: E2E 延迟 — P95 < 8s
      - alert: RAGSLOLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(rag_e2e_latency_seconds_bucket[5m]))) > 10
        for: 5m
        labels:
          severity: warning
          slo: latency_p95
        annotations:
          summary: "E2E 延迟 P95 > 10s"
          description: "5min 内 P95 延迟 {{ $value }}s,超过 10s 阈值"

      # SLO 3: 幻觉通过率 — pass + filter 比例 > 95%
      - alert: RAGSLOHallucinationPassRate
        expr: |
          sum(rate(rag_hallucination_action_total{action="reject"}[1h]))
          / sum(rate(rag_hallucination_action_total[1h])) > 0.10
        for: 10m
        labels:
          severity: critical
          slo: hallucination_pass_rate
        annotations:
          summary: "幻觉通过率 SLO 违约,reject 率 > 10%"

      # SLO 4: 检索成功率 — 非 fallback_web 比例 > 98%
      - alert: RAGSLORetrievalSuccess
        expr: |
          sum(rate(rag_quality_check_decision_total{decision="fallback_web"}[1h]))
          / sum(rate(rag_quality_check_decision_total[1h])) > 0.05
        for: 10m
        labels:
          severity: warning
          slo: retrieval_success
        annotations:
          summary: "检索成功率 SLO 违约,fallback_web 率 > 5%"
