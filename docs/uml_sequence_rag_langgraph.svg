nd them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="703.356">U9obMUblsqOM_ww_OjRxHMaToMstnmfrK1yv33YD7QSe5hi1GP5ZYJL5gYILH0W2E6cSo8slRXAdEUh4</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="662.45">pM5l4SikqiQEPTT_J3Ka_Id_mhwP8IcEABi56Y0MESUxt--z6NvcExBbL4fwwczE4PSmAkkoPgJi2Sqe</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="686.643">ovPSGZR-ke8D1P_6jYqNS9-k5GoaOCF1LcoLXUsoQTZXgdwicnVxBCkyY1ohWbCfHtDqZFeAi4zJqDc-</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="671.234">asXODWedBRbSHEwlLxtLM-WeykwikhLDTtvX_rwTr3RylJlauPAtTiTThgLIikAO5lh21hR04gXePTbm</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="723.194">K5VVo10wRZXMzJz6MYvhMRbSjhEAQLp0bYqxccb8C7Aa2yasWgNYtaY6inN3m1QbG2NCwZ1UeEDPYqra</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="658.827">obLEWQyJYGoOfRAcOnKnIXreiByH2RQgJGMwOSoH7TnXjqt7ezriLIgLDo_5f4VUpg8xzr__sslUjJTT</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="693.991">wE_3Mg7ezEjWTmJ_15OLi9y43hMPPGnJfIpfZvqLfYA6NumcYMZWVCEHBBC2GI0I4QOY8aDdaqI-hiYw</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="680.723">vbGbfOYL2P68C1KH6Hr84YbRO7n7acqRb_9wLIJJDXaH6kbB4jBraWI6nnQOLwGIdub830-VJj8eohfU</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="690.047">KJH3JjfMc8ged1fC4Z7pu8OBSbvZ5X2825CHaJFzOqaguy1AbsJ3ljZkeFXCHED4NmeRAeAeIeGMsNnE</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="698.585">fZR9nbN_wLGOMYSjZ8qaKyZgSwQfTuXX1uRjh2KN9FhKogQ-aqagWx8ZvsKR7qfA3HQ9z0Rxa-I-nFb3</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="671.398">ALt4UP48R6Wp1eXv0k0CaHjJ-z-iUethpSRhq1J_mZfCTGfC3E6d01hIb8h0gU9eEerl69